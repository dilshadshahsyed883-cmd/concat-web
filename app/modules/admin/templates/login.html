<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sign in · Concat Web</title>
<link rel="stylesheet" href="/static/app.css">
<style>
body {min-height:100vh;display:grid;place-items:center;margin:0;background:#0b1220;color:#f8fafc;font-family:system-ui,sans-serif}
main {width:min(92vw,430px);background:#151c2c;border:1px solid #334155;border-radius:16px;padding:30px;box-sizing:border-box}
h1{font-size:1.7rem;margin:0 0 8px}
p{color:#cbd5e1}
label{display:block;margin-top:18px;font-weight:600}
input{box-sizing:border-box;width:100%;margin-top:7px;border-radius:9px;border:1px solid #64748b;padding:12px;color:#fff;background:#0b1220;font-size:16px}
button{margin-top:24px;padding:12px 16px;width:100%;border:0;border-radius:9px;background:#3b82f6;color:white;font-weight:700;cursor:pointer}
small{display:block;margin-top:16px;color:#cbd5e1}
</style>
</head>
<body>
<main>
<h1>Concat Web</h1>
<p>Sign in to your private workspace.</p>
<form action="/auth/login" method="post" autocomplete="on">
<label for="username">Username</label>
<input id="username" name="username" type="text" maxlength="128" autocomplete="username" required>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button>
</form>
<small>Access is limited to the configured administrator.</small>
</main>
</body>
</html>
