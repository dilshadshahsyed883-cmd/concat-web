name: Concat Web manual release verification (NO DEPLOY)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused source and security checks without SSH or deployment
        run: |
          set -Eeuo pipefail
          python -m pip install -e '.[test]'
          python -m compileall -q app run.py reused
          python -m unittest discover -s tests -p 'test_admin_security.py' -v
          python -m unittest discover -s tests -p 'test_local_admin.py' -v
          python -m unittest discover -s tests -p 'test_release_security_contract.py' -v
          bash -n deploy/guarded-release.sh
